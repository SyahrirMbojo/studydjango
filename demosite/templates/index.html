<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Study Django
      {% endblock %}
    </title>

    <!-- Fomantic UI -->
    {% comment %} <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.2/dist/semantic.min.css" /> {% endcomment %}
    <link rel="stylesheet" type="text/css" href="{% static 'node/semantic/dist/semantic.min.css' %}" />

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    {% include 'layout/navbar.html' %}
    {% block content %}

    {% endblock %}
    {% include 'layout/footer.html' %}

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

    <!-- Fomantic UI -->
    {% comment %} <script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.2/dist/semantic.min.js"></script> {% endcomment %}
    <script src="{% static 'node/semantic/dist/semantic.min.js' %}"></script>

    <script src="{% static 'js/script.js' %}"></script>

    {% block script %}

    {% endblock %}
  </body>
</html>
